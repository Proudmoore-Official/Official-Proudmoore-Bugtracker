name: Jaina's To-Do List

on:
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened
  issue_comment:
    types:
      - created
      - edited

jobs:
  send-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send issue update to Discord
        run: |
          DISCORD_WEBHOOK="https://discord.com/api/webhooks/1405635010316468305/Dkb68vQUFBiNhRrIF2HFKLaq_x-4yVgOW_DmOkxJBJIbN74Mh-MAm6Cqla4YKyia95Xy"
          ACTION="${{ github.event.action }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_BODY="${{ github.event.issue.body }}"
          ISSUE_URL="${{ github.event.issue.html_url }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ISSUE_USER="${{ github.event.issue.user.login }}"
          COMMENT_BODY="${{ github.event.comment.body }}"

          # Emoji for action
          case "$ACTION" in
            opened)   ACTION_ICON="🆕" ;;
            closed)   ACTION_ICON="✅" ;;
            reopened) ACTION_ICON="🔄" ;;
            edited)   ACTION_ICON="✏️" ;;
            created)  ACTION_ICON="💬" ;; # comment created
            *)        ACTION_ICON="📜" ;;
          esac

          # Function to truncate long text
          truncate() {
            local text="$1"
            local max_length=500
            if [ ${#text} -gt $max_length ]; then
              echo "${text:0:$max_length}..."
            else
              echo "$text"
            fi
          }

          if [ "$COMMENT_BODY" != "" ]; then
            SHORT_COMMENT=$(truncate "$COMMENT_BODY")
            MESSAGE="$ACTION_ICON **Jaina's To-Do List**\nAction: **${ACTION}**\nIssue #${ISSUE_NUMBER}: ${ISSUE_TITLE}\nComment: ${SHORT_COMMENT}\nBy: ${ISSUE_USER}\n${ISSUE_URL}"
          else
            SHORT_BODY=$(truncate "$ISSUE_BODY")
            MESSAGE="$ACTION_ICON **Jaina's To-Do List**\nAction: **${ACTION}**\nIssue #${ISSUE_NUMBER}: ${ISSUE_TITLE}\nDescription: ${SHORT_BODY}\nReported by: ${ISSUE_USER}\n${ISSUE_URL}"
          fi

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"${MESSAGE}\"}" \
            "$DISCORD_WEBHOOK"
