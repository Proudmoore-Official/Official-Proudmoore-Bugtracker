name: Jaina's To-Do List

on:
  issues:
    types:
      - opened
      - edited
      - comment
      - closed
      - reopened


jobs:
  send-to-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send issue update to Discord
        run: |
          DISCORD_WEBHOOK="${{ secrets.DISCORD_WEBHOOK }}"
          ACTION="${{ github.event.action }}"
          ISSUE_TITLE="${{ github.event.issue.title }}"
          ISSUE_COMMENT="${{ github.event.issue.comment }}"
          ISSUE_URL="${{ github.event.issue.html_url }}"
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          ISSUE_USER="${{ github.event.issue.user.login }}"

          MESSAGE="📜 **Jaina's To-Do List**\nAction: **${ACTION}**\nIssue #${ISSUE_NUMBER}: ${ISSUE_TITLE}\nReported by: ${ISSUE_USER}\n${ISSUE_URL}"

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\": \"${MESSAGE}\"}" \
            "$DISCORD_WEBHOOK"
